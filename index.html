<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A responsive JavaScript To-Do List application with local storage persistence."
    >

    <title>TaskFlow | To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div>
                <p class="eyebrow">JAVASCRIPT PROJECT</p>

                <h1>Task<span>Flow.</span></h1>

                <p class="subtitle">
                    Organize your day. One task at a time.
                </p>
            </div>

            <div class="task-summary">
                <strong id="taskCount">0</strong>
                <span>tasks</span>
            </div>
        </header>


        <!-- Add Task -->
        <section class="add-task-card" aria-label="Add a new task">

            <form id="taskForm">

                <label for="taskInput" class="sr-only">
                    Enter a new task
                </label>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                    maxlength="100"
                    required
                >

                <button type="submit" class="add-btn">
                    <span>+</span>
                    Add Task
                </button>

            </form>

        </section>


        <!-- Filters -->
        <section class="toolbar">

            <div
                class="filters"
                role="group"
                aria-label="Filter tasks"
            >

                <button
                    class="filter-btn active"
                    data-filter="all"
                    type="button"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="active"
                    type="button"
                >
                    Active
                </button>

                <button
                    class="filter-btn"
                    data-filter="completed"
                    type="button"
                >
                    Completed
                </button>

            </div>

            <button
                id="clearCompleted"
                class="clear-btn"
                type="button"
            >
                Clear completed
            </button>

        </section>


        <!-- Task List -->
        <section class="tasks-section">

            <div
                id="taskList"
                class="task-list"
                aria-live="polite"
            ></div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">

                <div class="empty-icon">✓</div>

                <h2>You're all caught up.</h2>

                <p>
                    Add a task above and start getting things done.
                </p>

            </div>

        </section>


        <!-- Footer -->
        <footer class="app-footer">

            <p>
                Your tasks are saved automatically in your browser.
            </p>

            <button
                id="clearAll"
                class="danger-btn"
                type="button"
            >
                Delete all tasks
            </button>

        </footer>

    </main>


    <!-- Edit Modal -->
    <div
        id="editModal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-box">

            <button
                id="closeModal"
                class="close-modal"
                type="button"
                aria-label="Close edit window"
            >
                ×
            </button>

            <p class="eyebrow">EDIT TASK</p>

            <h2>Update your task</h2>

            <label for="editInput">
                Task name
            </label>

            <input
                type="text"
                id="editInput"
                maxlength="100"
            >

            <button
                id="saveEdit"
                class="save-btn"
                type="button"
            >
                Save Changes
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
